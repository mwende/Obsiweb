name: Deploy to Production (notes.wende.it)

on:
  push:
    branches:
      - main
  workflow_dispatch: # manuell auslösen = Neu-Deployment erzwingen (auch ohne neue Commits)

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3, auf Commit fixiert: die Action sieht den SSH-Schlüssel
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 15m
          # deploy/autodeploy.sh: fetch → build → test → migrate → pm2 restart → Health-Check, bei Fehler Rollback.
          # Das Deploy-Log dieses Laufs wird hier ausgegeben; der Exit-Code entscheidet über Erfolg/Fehlschlag.
          script: |
            APP_DIR=/home/wende-notes/htdocs/notes.wende.it/ObsidianWEB
            LOG=$HOME/logs/obsiweb-deploy.log
            mkdir -p "$(dirname "$LOG")"; touch "$LOG"
            START=$(($(wc -l < "$LOG") + 1))
            # Deploy-Skript immer aus dem neuesten Commit nehmen (funktioniert auch, wenn es im Arbeitsverzeichnis
            # noch fehlt oder sich mit diesem Push ändert)
            SCRIPT=$HOME/.cache/obsiweb-autodeploy.sh
            mkdir -p "$(dirname "$SCRIPT")"
            git -C "$APP_DIR" fetch --quiet origin main && git -C "$APP_DIR" show origin/main:deploy/autodeploy.sh > "$SCRIPT" || { echo "✗ git fetch/show fehlgeschlagen"; exit 1; }
            APP_DIR="$APP_DIR" VERBOSE=1 FORCE=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }} bash "$SCRIPT"
            RC=$?
            tail -n +"$START" "$LOG"
            if [ "$RC" -eq 0 ]; then echo "✓ Stand: $(git -C "$APP_DIR" log --oneline -1)"; else echo "✗ Deployment fehlgeschlagen (Exit $RC)"; fi
            exit $RC
